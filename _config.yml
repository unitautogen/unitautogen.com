# unitautogen.com - Jekyll site config (built by GitHub Pages, no CI needed)

title: UnitAutogen
description: >-
  UnitAutogen auto-generates database unit tests - and the data that drives them -
  so the logic inside your database is actually tested.
author: Munaf Khatri

# --- hosting ---------------------------------------------------------------
# Custom domain (CNAME file = unitautogen.com). All links are built with relative_url,
# so the site also works under a sub-path if baseurl is ever set again.
url: "https://unitautogen.com"
baseurl: ""

# The database the site opens on when the visitor has not picked one (header tabs + menu panel).
# Must match an id in _data/catalog.yml.
default_db: postgresql

plugins:
  - jekyll-feed      # generates /feed.xml from _posts
  - jekyll-sitemap   # generates /sitemap.xml

feed:
  path: feed.xml

# Default footer for pages outside a database section (home, blog, use cases).
# The header is built in _layouts/default.html from _data/catalog.yml.
footer_left: "(c) 2026 UnitAutogen - automated database test generation."
footer_sep: "-"
footer_links:
  - label: "PostgreSQL"
    href: "/postgresql/"
  - label: "SQL Server"
    href: "/sql-server/"
  - label: "Oracle + EDB"
    href: "/oracle/"
  - label: "GitHub"
    href: "https://github.com/unitautogen"

defaults:
  # blog posts: _posts/YYYY-MM-DD-slug.html  ->  /blog/slug.html  (same URLs as today)
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title.html
      author: Munaf Khatri
      body_class: post-page
      footer_left: "(c) 2026 UnitAutogen &middot; <a href=\"__BASE__/postgresql/rlsautotest/\">rlsautotest</a>, the free PostgreSQL companion &middot; open source under <a href=\"https://github.com/unitautogen/rlsautotest/blob/main/LICENSE\">Apache-2.0</a>"
      footer_sep: "&middot;"
      footer_links:
        - label: "Products"
          href: "/"
        - label: "GitHub"
          href: "https://github.com/unitautogen/rlsautotest"
        - label: "PyPI"
          href: "https://pypi.org/project/rlsautotest/"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - .jekyll-cache
