        meta_line: "Built on tSQLt - SQL Server 2017+ - in early access"
        status_title: "Where it is, honestly"
        status_note: >-
          The SQL Server tool is in early access and sits behind our PostgreSQL engine while we
          bring it up to the same standard. We are being upfront about that rather than presenting
          it as finished: a product whose whole promise is never a false green should not oversell
          its own maturity. If you run SQL Server and want in early, tell us about your workload.
        capabilities_lead: >-
          The hard part isn't faking the table, it's the data. Mocking a table gives you an empty
          table, so a branch that needs matching rows only ever runs its "no rows" side. UnitAutogen
          reads each predicate in the procedure and works backwards from it to build the rows that
          drive that branch both ways, and asserts the data actually drove the condition the intended
          way, so a wrong guess fails loudly instead of passing at the wrong coverage.
        capabilities:
