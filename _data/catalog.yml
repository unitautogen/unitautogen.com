    cta_label: "Talk to us"
    cta_href: "mailto:hello@unitautogen.com"
    cta_style: "btn ghost"
    cta2_label: "What it does"
    cta2_href: "/sql-server/unitautogen/"
    status_title: "Where it is, honestly"
    status_note: >-
      The SQL Server tool is in early access and sits behind our PostgreSQL engine while we
      bring it up to the same standard. The method is the same one proven on PostgreSQL: read the
      procedures and functions, generate the tSQLt tests and the data that drive every branch, and
      report real coverage. If you run SQL Server and want in early, tell us about your workload.
    products_lead: ""
    footer_left: "(c) 2026 UnitAutogen - SQL Server"
    products:
      - name: "UnitAutogen for SQL Server"
        short: "UnitAutogen for SQL Server"
        slug: "unitautogen"
        url: "/sql-server/unitautogen/"
        framework: "tSQLt"
        badge: "Early access"
        badge_kind: "early"
        blurb: >-
          Generates tSQLt tests with real line and branch coverage for stored procedures and
          functions, across the whole database, with Cobertura, JUnit and HTML output for CI.
        hero_a: "Auto-generated SQL Server tests"
        hero_hl: "with real branch coverage"
        hero_b: "."
        sub: >-
          Point UnitAutogen at a stored procedure, or your whole database, and it writes the tSQLt
          tests, generates the data to drive every branch, runs them, and reports real line and
          branch coverage. The same method proven on PostgreSQL, brought to SQL Server.
        cta_label: "Talk to us"
        cta_href: "mailto:hello@unitautogen.com"
        meta_line: "Built on tSQLt - SQL Server 2017+ - in early access"
        status_title: "Where it is, honestly"
        status_note: >-
          The SQL Server tool is in early access and sits behind our PostgreSQL engine while we
          bring it up to the same standard. We are being upfront about that rather than presenting
          it as finished: a product whose whole promise is never a false green should not oversell
          its own maturity. If you run SQL Server and want in early, tell us about your workload.
        capabilities_lead: >-
          The hard part isn't faking the table, it's the data. Mocking a table gives you an empty
          table, so a branch that needs matching rows only ever runs its "no rows" side. UnitAutogen
          reads each predicate in the procedure and works backwards from it to build the rows that
          drive that branch both ways, and asserts the data actually drove the condition the intended
          way, so a wrong guess fails loudly instead of passing at the wrong coverage.
        capabilities:
          - name: "Whole-database sweep"
            blurb: "One command generates, runs, and measures coverage across every testable procedure and function."
          - name: "CI/CD-ready"
            blurb: "Cobertura, JUnit and HTML output for Azure DevOps, GitHub Actions, Jenkins, GitLab and SonarQube."
          - name: "Honest by design"
            blurb: "What it can't test is flagged NOT_TESTABLE with the reason, never faked into a green pass."
        get_started_title: "Get early access"
        get_started_lead: >-
          Built on the open-source <a href="https://tsqlt.org">tSQLt</a> framework. It is not yet
          available for general download while we bring it up to date. Tell us about your SQL Server
          workload and we'll get you in early.
        get_started_points:
          - "SQL Server 2017+ with tSQLt installed"
          - "Generates tSQLt tests and the data that drives every branch, plus real line and branch coverage"
          - "Earlier validation reached roughly 94% branch coverage on AdventureWorks, up from about 50% without seeded data"
          - "In early access - behind the PostgreSQL engine while we bring it to the same standard"
        footer_left: "(c) 2026 UnitAutogen - SQL Server engine"

