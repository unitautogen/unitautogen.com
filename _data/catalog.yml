# Use cases - the second nav axis (the problem / who it's for). Delivered on PostgreSQL today.
# [framework] is replaced with the current database's framework name.
use_cases:
  - slug: "unit-testing"
    name: "Unit testing for developers"
    blurb: "Generated unit tests and seed data for every routine, with branch coverage. Free."
    card: "Generated unit tests and seed data for every routine you own, with honest branch coverage. Free."
  - slug: "integration-testing"
    name: "Integration testing for QA"
    blurb: "Each entry point run with what it calls and fires. Coverage across the call map, every build."
    card: "Each entry point run with everything it calls and fires, coverage across the call map, on every build."
  - slug: "ai-guardrail"
    name: "Guardrail for AI-written code"
    blurb: "Generated tests pin today's behaviour. An AI edit that breaks it fails before production."
    card: "Generated tests pin today's behaviour, so the next change - human or AI - that breaks it fails before production."
  - slug: "change-verification"
    name: "Behavioural change verification"
    blurb: "Migration tools deploy the change. UnitAutogen proves the logic still behaves the same."
    card: "Migration tools deploy your change; UnitAutogen proves the changed logic still behaves the same."
  - slug: "tenant-isolation"
    name: "Prove tenant isolation and security"
    blurb: "rlsautotest proves the policies, seccover proves the code that bypasses them. Both, or no proof."
    card: "rlsautotest proves the policies; seccover proves the functions, views and triggers that bypass them. Together: complete leakage detection."
    only_db: postgresql
  - slug: "compliance-evidence"
    name: "Compliance evidence"
    blurb: "Dated [framework] tests and reports as supporting evidence for HIPAA and SOC 2 access controls."
    card: "Dated [framework] tests and reports that support your HIPAA and SOC 2 access controls."
