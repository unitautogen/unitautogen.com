# catalog.yml - the single source of truth for the platform, its databases and products.
#
# EVERYTHING engine-specific lives here: the framework name, the runner, what objects are
# tested, versions, prerequisites, links, badges, the capability cards and the menu.
# The pages under /<database>/ are 3-line stubs rendered by _layouts/catalog.html and
# _layouts/product.html from this file. Adding a database = one block here + two stubs.
#
# Text fields may contain the token [framework]; templates replace it with the current
# database's framework name so shared copy (use cases, method) stays engine-neutral.
#
# Keep claims honest: badge reflects real maturity, and no engine is presented at parity
# with another.

platform:
  name: "UnitAutogen"
  tagline_a: "The logic in your database is mostly"
  tagline_hl: "untested"
  tagline_b: ". We fix that."
  sub: >-
    Unit tests for your database logic, generated from the code. The seed data too.
    Nothing written by hand.
  sub_points:
    - "Reads your functions, procedures and triggers"
    - "Writes one test per branch, in your database's own test framework"
    - "Creates the rows each test depends on"
    - "Runs the suite, reports line and branch coverage, never a false pass"
  automatic_title: "Tests and seed data, generated end to end"
  automatic_points:
    - title: "Point it at a database"
      text: "A connection and a schema. Nothing to annotate."
    - title: "It generates the unit tests"
      text: "One test per branch, in the native framework, ready to commit."
    - title: "It derives the seed data"
      text: "The exact rows and identities each test depends on. No fixtures."
    - title: "It runs the suite and reports coverage"
      text: "Line and branch coverage. Uncovered lines explained. Never a false pass."
  # The one method - said once, engine-independent. No database named on purpose.
  method:
    - "Reads the logic in your database - functions, procedures, triggers"
    - "Generates the unit tests - none written by hand"
    - "Derives and creates the seed data each test depends on - no fixtures"
    - "Runs them in the native test framework and reports honest branch coverage, never a false pass"
  guarantee_title: "The one guarantee"
  guarantee: "Never a fabricated, false-passing, or flaky test."
  guarantee_points:
    - "A branch that cannot be tested reliably is reported, with the reason"
    - "No failing tests, no false tests, in any report"
    - "An explained gap always beats a false pass"
    - "Safe to gate CI on"

# Databases in tab / home order. slug drives the URL: /<slug>/
# The first one is the default the site opens on (also set as default_db in _config.yml).
databases:
  - id: postgresql
    slug: "postgresql"
    name: "PostgreSQL"
    name_full: "PostgreSQL / Supabase"
    badge: "Beta"
    badge_kind: "beta"
    # --- vocabulary used by the templates ---
    framework: "pgTAP"
    runner: "pg_prove or runtests()"
    objects: "functions and triggers"
    versions: "PostgreSQL 14 to 18"
    platforms: "PostgreSQL 14 to 18. Supabase, Neon, Amazon RDS and Aurora, Azure Database for PostgreSQL, self-hosted."
    prerequisites: "needs pgTAP and plpgsql_check in the target database"
    meta_line: "Native pgTAP - runs with <code>pg_prove</code> or <code>runtests()</code>, with or without us."
    # --- links ---
    repo: "https://github.com/unitautogen/unitautogen-postgresql"
    docs_href: "https://github.com/unitautogen/unitautogen-postgresql#readme"
    download_href: "https://github.com/unitautogen/unitautogen-postgresql/releases"
    # --- catalog page ---
    hero_a: "Test your PostgreSQL logic,"
    hero_hl: "tests generated for you"
    hero_b: "."
    blurb: >-
      pgTAP unit tests and seed data for your functions and triggers, generated and run for you,
      with honest branch coverage.
    points:
      - "Unit and trigger tests, free"
      - "Integration tests across the call map"
      - "Security coverage: tenant isolation through functions, views and triggers"
      - "PII leak detection in error paths"
    cta_label: "Download"
    cta_href: "https://github.com/unitautogen/unitautogen-postgresql/releases"
    cta_style: "btn"
    cta2_label: "See the engine"
    cta2_href: "/postgresql/unitautogen/"
    products_lead: "Two tools, one method: generate the tests and the data behind them."
    footer_left: "(c) 2026 UnitAutogen - PostgreSQL"
    # rlsautotest and the UnitAutogen engine test DIFFERENT layers; complete leakage detection needs both.
    # Rendered by _includes/pairing.html on the PostgreSQL overview, both product pages and the tenant-isolation use case.
    pairing:
      title: "Two layers where tenant data leaks. One tool for each. Use both."
      lead: "A test at one layer says nothing about the other."
      lead_points:
        - "Policy layer: Row-Level Security governs direct table access"
        - "Code layer: SECURITY DEFINER functions, views and owner-run triggers bypass RLS by design"
      sides:
        - name: "rlsautotest"
          layer: "Policy layer"
          url: "/postgresql/rlsautotest/"
          link: "rlsautotest, free and open source"
          does_points:
            - "Proves each RLS policy: per table, per command, per identity"
            - "Fails CI on a reachable table with no policy"
            - "Names every SECURITY DEFINER function, view and trigger as a suspect"
          cannot: "Judge the suspects. It sees that code bypasses RLS, not whether it leaks."
        - name: "UnitAutogen seccover"
          layer: "Code layer"
          url: "/postgresql/unitautogen/seccover/"
          link: "seccover, in the UnitAutogen engine"
          does_points:
            - "Runs each suspect as two tenants with generated data on both sides"
            - "Verdict per routine: enforced or leaking, with table, command and channel"
            - "PII pass: personal data escaping through error messages"
          cannot: "Stand in for the policies. Direct table access is rlsautotest's job."
      close: "Complete leakage detection is both: policies verified by rlsautotest, code paths verified by UnitAutogen."
    pricing:
      title: "Editions and pricing"
      lead: "One binary, three editions. Offline key file, no telemetry."
      buy_note: "Online purchase is under development. Until then, email <a href=\"mailto:licensing@unitautogen.com\">licensing@unitautogen.com</a> and your licence is issued by email within one business day."
      editions:
        - name: "Community Edition"
          price: "Free"
          unit: "no licence key, no time limit"
          audience: "Developers, open-source projects, evaluation."
          includes:
