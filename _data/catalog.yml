        - title: "Buying a licence"
          text: "Online purchase is under development. Until it ships, email licensing@unitautogen.com with the edition and the number of developers or clusters; you receive an invoice and, on payment, the key file by email."
        - title: "How licensing works"
          text: "A licence is an Ed25519-signed key file you place next to the binary. It is verified offline; no telemetry, no network call. On expiry the paid capabilities switch off and the Community Edition keeps working; your committed tests are never touched."
