            - "Line and branch coverage with every uncovered line explained"
            - "CI exit codes, JSON and HTML reports"
            - "Commercial use permitted; generated tests and reports are yours"
          footnote: "Output carries a Community Edition watermark."
          cta_label: "Download"
          cta_href: "https://github.com/unitautogen/unitautogen-postgresql/releases"
          cta_style: "btn ghost"
        - name: "Team"
          price: "USD 400"
          unit: "per developer, per year"
          audience: "Teams running the suite in CI."
          includes:
            - "Everything in Community Edition, unwatermarked"
            - "Integration testing across the call map"
            - "One named key per developer, bound to their email"
            - "Email support"
          cta_label: "Email licensing@unitautogen.com"
          cta_href: "mailto:licensing@unitautogen.com?subject=UnitAutogen%20for%20PostgreSQL%20-%20Team%20licence"
          cta_style: "btn"
          highlight: true
        - name: "Enterprise"
          price: "USD 6,000"
          unit: "per production database cluster, per year"
          audience: "Multi-tenant SaaS, healthcare, finance."
          includes:
            - "Everything in Team, for every developer on the cluster"
            - "seccover: security coverage through functions, views and triggers"
            - "PII leak detection in error paths"
            - "Dated reports as supporting evidence for HIPAA and SOC 2 controls"
            - "Priority support"
          footnote: "Staging and preview clusters of a licensed production cluster are not charged."
          cta_label: "Email licensing@unitautogen.com"
          cta_href: "mailto:licensing@unitautogen.com?subject=UnitAutogen%20for%20PostgreSQL%20-%20Enterprise%20licence"
          cta_style: "btn"
      extras:
        - title: "Consultants and resellers"
          text: "One licence to run it from your infrastructure across your clients: USD 12,000 per year, list. A client running it in their own CI needs their own Enterprise licence."
        - title: "rlsautotest"
          text: "Apache-2.0. Free for any use, no licence needed."
        - title: "Buying a licence"
          text: "Email licensing@unitautogen.com with the edition and the number of developers or clusters. Invoice by email; key file on payment."
        - title: "How licensing works"
          text: "A signed key file next to the binary, verified offline. On expiry the paid capabilities stop; Community Edition keeps working and committed tests are untouched."
    products:
      - name: "UnitAutogen for PostgreSQL"
        short: "UnitAutogen engine"
        slug: "unitautogen"
        url: "/postgresql/unitautogen/"
        repo: "https://github.com/unitautogen/unitautogen-postgresql"
